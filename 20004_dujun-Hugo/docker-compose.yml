#Hugo 0.170.1

version: '2.4'

services:
  data:
    image: dujunio/dujun-hugo
    volumes:
      - wwwroot:/wwwroot
      - vhost:/etc/nginx/sites-enabled
      - init:/init
    tty: true

  nginx:
    image: dujunio/nginx:1.22
    depends_on:
      - data
    volumes:
      - wwwroot:/wwwroot
      - vhost:/etc/nginx/sites-enabled
      - init:/init
    environment:
      - EXAMPLE_DOMAIN=dujun-hugo.dujun.eu.org
    ports:
      - "20004:80"
    tty: true
    container_name: dujun-hugo

volumes:
  wwwroot:
  vhost:
  init:
